name: AURA APK Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini oluştur (yoksa)
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_bak
            cp pubspec.yaml /tmp/pubspec_bak.yaml
            flutter create --platforms=android --org com.aura --project-name aura --no-pub .
            rm -rf lib && cp -r /tmp/lib_bak lib
            cp /tmp/pubspec_bak.yaml pubspec.yaml
          fi
          rm -f test/widget_test.dart

      - name: Uygulama adını AURA yap
        run: sed -i 's/android:label="[^"]*"/android:label="AURA"/' android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir
        run: flutter pub get

      - name: APK üret (release, ABI başına)
        run: flutter build apk --release --split-per-abi

      - name: APK'ları artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: aura-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: GitHub Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
